plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.evida.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.evida.france'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '0.8.0'
    }

    def storeFilePath = providers.gradleProperty("EVIDA_STORE_FILE").orNull
    def storePasswordValue = providers.gradleProperty("EVIDA_STORE_PASSWORD").orNull
    def keyAliasValue = providers.gradleProperty("EVIDA_KEY_ALIAS").orNull
    def keyPasswordValue = providers.gradleProperty("EVIDA_KEY_PASSWORD").orNull

    if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
        signingConfigs {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
