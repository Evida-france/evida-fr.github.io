<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ÉVIDA — Découvrez l'évidence</title>

<meta
  name="description"
  content="ÉVIDA sélectionne des produits utiles, ingénieux et surprenants pour améliorer le quotidien."

<style>

:root{
  --bg:#f7f4ef;
  --card:#ffffff;
  --text:#151515;
  --muted:#746e67;
  --line:#e5e0d8;
  --black:#151515;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   BARRE SUPÉRIEURE
========================= */

.topbar{
  background:#111;
  color:#fff;
  text-align:center;
  padding:9px 15px;
  font-size:12px;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(247,244,239,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1240px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:.18em;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:26px;
  font-size:14px;
}

.navlinks button{
  border:0;
  background:transparent;
  padding:8px;
}

.cartButton{
  border:0;
  background:#111;
  color:#fff;
  padding:11px 17px;
  border-radius:10px;
  font-weight:800;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:1240px;
  margin:auto;
  padding:58px 20px 35px;
}

.eyebrow{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}

h1{
  margin:11px 0 18px;
  font-size:clamp(48px,7vw,88px);
  letter-spacing:-.055em;
  line-height:.92;
}

  line-height:1
