<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace ÉVIDA</title><link rel="stylesheet" href="storefront.css"></head><body><header><div class="nav"><a class="logo" href="index.html">ÉVIDA</a><a href="index.html">Boutique</a></div></header><main class="wrap"><p class="eyebrow">Lien privé</p><h1>Mon espace ÉVIDA</h1><div id="account" class="notice">Chargement de vos commandes…</div></main><script>const token=new URLSearchParams(location.search).get('token')||'';const euro=n=>(n/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});fetch('https://evida-france.netlify.app/.netlify/functions/customer-account?token='+encodeURIComponent(token)).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('account').innerHTML='<h2>Bonjour '+d.customer.firstName+'</h2>'+(d.orders.length?d.orders.map(o=>'<article class="cartItem"><strong>'+o.id+'</strong><p>Total : '+euro(o.total)+'</p><p>Paiement : '+o.paymentStatus+' · Préparation : '+o.fulfillmentStatus+'</p>'+(o.trackingUrl?'<a href="'+o.trackingUrl+'">Suivre mon colis</a>':'<span>Suivi disponible après expédition</span>')+'</article>').join(''):'<p>Aucune commande payée pour le moment.</p>')}).catch(e=>document.getElementById('account').innerHTML='<p class="error">'+e.message+'</p>')</script></body></html>
