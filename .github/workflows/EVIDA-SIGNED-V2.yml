name: EVIDA SIGNED V3 - GOOGLE PLAY RESET KEY

on:
  workflow_dispatch:

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure EVIDA Google Play build
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.evida.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.evida.france'
                  minSdk 24
                  targetSdk 36
                  versionCode 6
                  versionName '0.5.1'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build release AAB
        run: gradle :app:clean :app:bundleRelease --stacktrace

      - name: Generate new permanent upload key
        shell: bash
        run: |
          set -euo pipefail

          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          keytool -genkeypair \
            -storetype JKS \
            -keystore "$GITHUB_WORKSPACE/evida-upload-key.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias evida-upload \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=EVIDA, OU=Android, O=EVIDA, L=Paris, C=FR"

          keytool -export \
            -rfc \
            -keystore "$GITHUB_WORKSPACE/evida-upload-key.jks" \
            -storepass "$STORE_PASS" \
            -alias evida-upload \
            -file "$GITHUB_WORKSPACE/upload_certificate.pem"

          {
            echo "EVIDA - CLE D'IMPORTATION GOOGLE PLAY"
            echo "CONSERVER CE FICHIER EN LIEU SUR"
            echo "Alias: evida-upload"
            echo "Store password: $STORE_PASS"
            echo "Key password: $KEY_PASS"
          } > "$GITHUB_WORKSPACE/evida-key-credentials.txt"

          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Sign AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$GITHUB_WORKSPACE/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/evida-upload-key.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            evida-upload

      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail

          AAB="$GITHUB_WORKSPACE/app/build/outputs/bundle/release/app-release.aab"

          jarsigner -verify -verbose -certs "$AAB"

          keytool -printcert \
            -jarfile "$AAB" \
            > "$GITHUB_WORKSPACE/aab-certificate.txt"

      - name: Prepare Google Play files
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/google-play-output"

          cp "$GITHUB_WORKSPACE/app/build/outputs/bundle/release/app-release.aab" \
             "$GITHUB_WORKSPACE/google-play-output/EVIDA-0.5.1-PLAY-SIGNED.aab"

          cp "$GITHUB_WORKSPACE/upload_certificate.pem" \
             "$GITHUB_WORKSPACE/google-play-output/upload_certificate.pem"

          cp "$GITHUB_WORKSPACE/evida-upload-key.jks" \
             "$GITHUB_WORKSPACE/google-play-output/evida-upload-key.jks"

          cp "$GITHUB_WORKSPACE/evida-key-credentials.txt" \
             "$GITHUB_WORKSPACE/google-play-output/evida-key-credentials.txt"

          cp "$GITHUB_WORKSPACE/aab-certificate.txt" \
             "$GITHUB_WORKSPACE/google-play-output/aab-certificate.txt"

      - name: Upload Google Play package
        uses: actions/upload-artifact@v4
        with:
          name: EVIDA-GOOGLE-PLAY-RESET-KEY
          path: google-play-output/
          retention-days: 1
          if-no-files-found: error
