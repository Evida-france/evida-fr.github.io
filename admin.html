<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration ÉVIDA</title><link rel="stylesheet" href="storefront.css"><style>.admin{max-width:1100px;margin:auto;padding:30px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.inputs label{display:grid;gap:5px}.inputs input,.inputs select{padding:10px;border:1px solid var(--line);border-radius:8px}.result{font-size:24px;font-weight:bold}.orders{display:grid;gap:12px}.order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.photo{max-width:220px;border-radius:12px}@media(max-width:700px){.inputs{grid-template-columns:1fr}}</style></head><body><main class="admin"><div class="logo">ÉVIDA</div><h1>Suivi et rentabilité</h1><section class="panel"><h2>Accès sécurisé</h2><label>Clé administrateur <input id="token" type="password" autocomplete="off"></label><button id="load" class="pay">Charger les commandes</button><p id="status"></p></section><section class="panel"><h2>Calculateur de marge</h2><div class="inputs"><label>Prix payé par le client (€)<input id="sale" type="number" step=".01" value="29.90"></label><label>Prix fournisseur TTC (€)<input id="cost" type="number" step=".01" value="0"></label><label>Livraison fournisseur TTC (€)<input id="ship" type="number" step=".01" value="0"></label><label>Commission paiement (%)<input id="payfee" type="number" step=".01" value="2.5"></label><label>Commission TikTok (%)<input id="tiktok" type="number" step=".01" value="0"></label><label>Cotisations (%)<input id="social" type="number" step=".01" value="12.3"></label><label>Publicité par vente (€)<input id="ads" type="number" step=".01" value="0"></label><label>Réserve retours (%)<input id="returns" type="number" step=".01" value="3"></label></div><p class="result" id="margin"></p><p id="marginDetail"></p></section><section><h2>Commandes</h2><div id="orders" class="orders"><p>Aucune commande chargée.</p></div></section></main><script src="admin.js"></script></body></html>
